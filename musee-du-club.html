  <section class="page-header">
    <h1>Le Musée du Club</h1>
    <p>Une lettre, une carte.</p>
  </section>

  <section class="club-section">
    <form class="refuge-code club-code" autocomplete="off">
      <label for="club-code-input">Code de la carte</label>
      <div class="refuge-code-row">
        <input id="club-code-input" name="code" type="text" placeholder="ABCD1226-0001" required autocapitalize="characters" spellcheck="false">
        <button class="btn btn-pill" type="submit">Ajouter</button>
      </div>
      <p class="refuge-code-msg" role="status" aria-live="polite"></p>
    </form>

    <div class="club-museum">
      <div class="club-head">
        <h2 id="club-salle">Saison 1</h2>
        <p class="club-count">0 / 12</p>
      </div>
      <ol class="club-wall" aria-labelledby="club-salle"></ol>
    </div>

    <noscript><p class="club-note">Le musée a besoin de JavaScript pour afficher vos cartes.</p></noscript>
  </section>

  <div class="refuge-reveal club-reveal" hidden>
    <div class="refuge-reveal-rays" aria-hidden="true"></div>
    <div class="refuge-reveal-stage" role="dialog" aria-modal="true" aria-label="Une nouvelle carte arrive">
      <button class="refuge-crate" type="button">
        <span class="refuge-crate-label">Refuge Club<br>Fragile</span>
      </button>
      <p class="refuge-crate-hint">Touchez la caisse</p>
      <div class="refuge-reveal-card club-reveal-card" hidden>
        <div class="club-tilt">
          <div class="club-tilt-card">
            <img src="" alt="">
            <span class="club-tilt-holo" aria-hidden="true"></span>
            <span class="club-tilt-glare" aria-hidden="true"></span>
          </div>
        </div>
        <p class="eyebrow"></p>
        <h3></h3>
        <p class="club-reveal-num"></p>
        <button class="btn btn-pill club-reveal-go" type="button">L'accrocher dans ma salle</button>
      </div>
    </div>
  </div>

  <div class="club-viewer" role="dialog" aria-modal="true" aria-labelledby="club-viewer-title" hidden>
    <button class="club-viewer-close" type="button" aria-label="Fermer">×</button>
    <div class="club-tilt">
      <div class="club-tilt-card">
        <img src="" alt="">
        <span class="club-tilt-holo" aria-hidden="true"></span>
        <span class="club-tilt-glare" aria-hidden="true"></span>
      </div>
    </div>
    <div class="club-viewer-text">
      <h3 id="club-viewer-title"></h3>
      <p></p>
