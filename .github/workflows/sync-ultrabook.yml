name: Synchroniser le portfolio Ultra-Book

on:
  schedule:
    - cron: "17 5 * * *"   # chaque jour vers 6h-7h (heure belge)
  workflow_dispatch:        # bouton "Run workflow" pour lancer a la main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test_sync_ultrabook.py
      - run: python scripts/sync_ultrabook.py
      - name: Publier si quelque chose a change
        run: |
          git add galerie.html en/galerie.html photo/ultrabook
          if git diff --cached --quiet; then
            echo "Rien de nouveau sur Ultra-Book."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
            git commit -m "Portfolio : mise a jour depuis Ultra-Book"
            git push
          fi
